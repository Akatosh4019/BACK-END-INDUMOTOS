services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: indumotos
      POSTGRES_USER: ${DB_USER:?Definir DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - indumotos_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/indumotos
      DB_USER: ${DB_USER:?Definir DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Definir ADMIN_USERNAME en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD en .env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Definir JWT_SECRET_BASE64 en .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  indumotos_pgdata:
networks:
  default:
    name: indumotos_shared
