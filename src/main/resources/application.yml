spring:
  application:
    name: backendIndumotos
  config:
    # Desarrollo local (IntelliJ): lee las variables de .env si existe. Docker y las variables
    # de entorno del sistema siguen teniendo prioridad sobre este archivo.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/indumotos}
    username: ${DB_USER:indumotos}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
